[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmind-ai"
version = "1.0.2"
description = "Resume-ready AI engineering project: document processing, classical ML, PyTorch NLP, Transformers, vector search, RAG, FastAPI, evaluation, testing, and CI."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "joblib>=1.4,<2.0",
    "pandas>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "scikit-learn>=1.6,<2.0",
    "torch>=2.5,<3.0",
    "transformers>=4.45,<6.0",
    "sentence-transformers>=3.3,<6.0",
    "qdrant-client>=1.12,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
opsmind = "opsmind.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
